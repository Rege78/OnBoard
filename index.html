<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnBoard — Vitesse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menuBtn" class="menu-btn" aria-label="Ouvrir le menu">☰</button>

    <aside id="sidebar" class="sidebar" aria-hidden="true">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button id="addPageBtn" class="add-page" aria-label="Ajouter une page">＋</button>
        </div>
        <ul id="pagesList" class="pages-list" role="list"></ul>
    </aside>

    <div class="shell">
        <div class="container">
            <header class="topbar">
                <p class="eyebrow">Rege78</p>
                <h1 id="pageTitle">Vitesse</h1>
            </header>

            <main class="dashboard" id="mainContent">
                <section class="page" data-id="speed" id="page-speed">
                    <div class="speed-panel" aria-live="polite">
                        <div class="speed-display">
                            <span id="speed">0</span>
                            <span class="unit">km/h</span>
                        </div>
                        <div class="meta-row">
                            <div class="meta-card">
                                <h3>🕒 Heure</h3>
                                <p id="time">--:--</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="page" data-id="details" id="page-details" style="display: none;">
                    <div class="details-grid" aria-live="polite">
                        <div class="detail-card">
                            <h3>📍 Latitude</h3>
                            <p id="detail-lat">--</p>
                        </div>
                        <div class="detail-card">
                            <h3>📍 Longitude</h3>
                            <p id="detail-lon">--</p>
                        </div>
                        <div class="detail-card">
                            <h3>⛰️ Altitude</h3>
                            <p id="detail-alt">--</p>
                        </div>
                        <div class="detail-card">
                            <h3>🎯 Précision</h3>
                            <p id="detail-accuracy">--</p>
                        </div>
                        <div class="detail-card">
                            <h3>📐 Précision Alt.</h3>
                            <p id="detail-alt-accuracy">--</p>
                        </div>
                        <div class="detail-card">
                            <h3>🧭 Orientation</h3>
                            <p id="detail-heading">--</p>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="footer">
                <p>Site optimisé pour l'écran</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
